# mirage_r16: de_mirage, match 2393226 round 16, 3 clients, 30 s (examples/README.md).
# Paths are relative to the repository root; tools/download_examples.py fetches the data files.
paths:
  round_index: examples/data/mirage_r16/round_index.jsonl
  media_index: examples/data/mirage_r16/media_index.jsonl
  dataset_root: examples/data/mirage_r16/opencs2
  latent_cache_root: examples/data/mirage_r16/first_latents
  visibility_label_root: examples/data/mirage_r16/vislabels
  obs_signal_label_root: examples/data/mirage_r16/obslabels
run:
  latents: 121  # 1 + 4 per second: 30 s
