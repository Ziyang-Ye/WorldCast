name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU-only torch and torchvision; tests that need a GPU, the weights or the paper's data skip and say why.
      - name: Install torch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      # The dev extra (the tests' dependencies, the lint tools at their pinned versions) and the extras of training
      # and evaluation, without which the tests of data preparation, training and the metrics skip.
      - name: Install WorldCast
        run: pip install -e ".[dev,train,eval]"
      - name: black
        run: black --check worldcast tools tests
      - name: isort
        run: isort --check-only worldcast tools tests
      - name: flake8
        run: flake8 worldcast tools tests
      - name: pytest
        run: python -m pytest tests -q --tb=short
