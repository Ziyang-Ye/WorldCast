# Stage 1_long: stage 1 continued on 10 s windows (41 latent frames) for 6,000 steps (docs/training.md). The paper
# run: 128 GPUs x 2 windows = 256. checkpoint.init: stage 1 at step 34,000 (model.pt); data.train_manifest: the
# manifest of 10 s windows.
#
# The settings are the paper run's, the stage's defaults (STAGE_SETTINGS in worldcast/config/training.py;
# tools/train.py --print-config prints them). Pass the paths with train_paths.yaml and --set.

run:
  stage: "1_long"
