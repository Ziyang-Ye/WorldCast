# Stage 4: distillation into the four-step generator, 600 steps (docs/training.md). Step 600 is the released
# generator. The paper run: 64 GPUs x 1 window = 64. checkpoint.init: stage 3 at step 5,000 (EMA);
# distillation.teacher and distillation.critic: stage 2 at step 25,000 (EMA). The windows are those with
# memory frames, as in stage 3 (data.collision_meshes).
#
# The settings are the paper run's, the stage's defaults (STAGE_SETTINGS in worldcast/config/training.py;
# tools/train.py --print-config prints them). Pass the paths with train_paths.yaml and --set.

run:
  stage: "4"
